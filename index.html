<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>生產批次登錄</title>

  <script
    src="https://static.line-scdn.net/liff/edge/2/sdk.js">
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Noto Sans TC",
        sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .user-box {
      background: #f7f8fa;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 18px;
      font-size: 14px;
    }

    .user-name {
      font-weight: 700;
      margin-left: 5px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 7px;
      font-size: 15px;
    }

    .required { color: #e53935; }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d7dbe0;
      border-radius: 10px;
      font-size: 16px;
      background: #fff;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #777;
    }

    input[readonly] {
      background: #f3f4f6;
      color: #555;
    }

    textarea {
      resize: vertical;
      min-height: 85px;
    }

    .field-hint {
      margin-top: 6px;
      color: #777;
      font-size: 12px;
      line-height: 1.5;
    }

    .manual-hint {
      color: #a15c00;
    }

    .radio-group {
      display: flex;
      gap: 10px;
    }

    .radio-option {
      flex: 1;
      border: 1px solid #d7dbe0;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      background: #fff;
    }

    .radio-option input {
      width: auto;
      margin: 0;
    }

    .submit-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 17px;
      font-weight: 700;
      background: #1f9d55;
      color: #fff;
      cursor: pointer;
      margin-top: 4px;
    }

    .submit-btn:disabled {
      background: #aab2b9;
      cursor: not-allowed;
    }

    .pdf-btn {
      display: none;
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      background: #2563eb;
      color: #fff;
    }

    .message {
      display: none;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.6;
    }

    .message.success {
      display: block;
      background: #eaf8ef;
      color: #176b35;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #c62828;
    }

    .today-section {
      margin-top: 26px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
    }

    .today-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .today-header h2 {
      margin: 0;
      font-size: 18px;
    }

    .refresh-btn {
      border: none;
      background: #f0f2f5;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    .batch-card {
      background: #fff;
      border: 1px solid #e4e7eb;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .batch-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .batch-id {
      font-size: 16px;
      font-weight: 700;
    }

    .batch-status {
      background: #f0f2f5;
      border-radius: 20px;
      padding: 4px 9px;
      font-size: 12px;
      white-space: nowrap;
    }

    .material-lot {
      margin-top: 7px;
      font-size: 14px;
      font-weight: 600;
      color: #444;
    }

    .batch-part {
      font-size: 16px;
      font-weight: 600;
      margin-top: 9px;
    }

    .batch-detail {
      font-size: 14px;
      color: #666;
      margin-top: 5px;
      line-height: 1.5;
    }

    .batch-actions {
      margin-top: 12px;
    }

    .regen-btn {
      width: 100%;
      border: 1px solid #2563eb;
      background: #fff;
      color: #2563eb;
      border-radius: 9px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .regen-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .empty-message {
      text-align: center;
      color: #888;
      padding: 20px 10px;
    }

    .full-screen {
      position: fixed;
      inset: 0;
      background: #f5f6f8;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }

    .status-card {
      width: 100%;
      max-width: 370px;
      background: #fff;
      border-radius: 18px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0,0,0,.07);
    }

    .status-icon {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .status-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .status-text {
      color: #777;
      line-height: 1.6;
    }

    #mainApp { display: none; }
  </style>
</head>

<body>

<div
  id="loadingScreen"
  class="full-screen"
>
  <div class="status-card">
    <div class="status-icon">⏳</div>

    <div class="status-title">
      系統載入中
    </div>

    <div
      id="loadingText"
      class="status-text"
    >
      正在確認您的 LINE 身分...
    </div>
  </div>
</div>


<div
  id="unauthorizedScreen"
  class="full-screen"
  style="display:none;"
>
  <div class="status-card">
    <div class="status-icon">⚠️</div>

    <div class="status-title">
      無法進入系統
    </div>

    <div
      id="unauthorizedMessage"
      class="status-text"
    >
      您沒有使用此系統的權限
    </div>
  </div>
</div>


<div
  id="mainApp"
  class="container"
>
  <div class="card">

    <h1>📦 生產批次登錄</h1>

    <div class="subtitle">
      客供料 / 自購料生產批次管理
    </div>

    <div class="user-box">
      登錄人員：
      <span
        id="employeeName"
        class="user-name"
      >-</span>
    </div>

    <div
      id="messageBox"
      class="message"
    ></div>


    <form
      id="batchForm"
      autocomplete="off"
    >

      <div class="form-group">
        <label>
          料件來源
          <span class="required">*</span>
        </label>

        <div class="radio-group">

          <label class="radio-option">
            <input
              type="radio"
              name="materialSource"
              value="客供料"
              checked
            >
            客供料
          </label>

          <label class="radio-option">
            <input
              type="radio"
              name="materialSource"
              value="自購料"
            >
            自購料
          </label>

        </div>
      </div>


      <div class="form-group">
        <label for="materialLotNo">
          <span id="materialLotLabel">
            來料批次號（客戶 Lot）
          </span>
          <span class="required">*</span>
        </label>

        <input
          type="text"
          id="materialLotNo"
          placeholder="輸入客戶來料批次號"
          maxlength="100"
          required
        >

        <div
          id="materialLotHint"
          class="field-hint"
        >
          請依客戶來料標示輸入。
        </div>
      </div>


      <div class="form-group">
        <label for="arrivalDate">
          來料日期
          <span class="required">*</span>
        </label>

        <input
          type="date"
          id="arrivalDate"
          required
        >
      </div>


      <div class="form-group">
        <label for="partSearch">
          件號
          <span class="required">*</span>
        </label>

        <input
          type="text"
          id="partSearch"
          list="partList"
          placeholder="可從清單選擇，也可手動輸入"
          required
        >

        <datalist
          id="partList"
        ></datalist>

        <div
          id="partHint"
          class="field-hint"
        >
          可從既有件號清單選擇，也可直接輸入新件號。
        </div>
      </div>


      <div class="form-group">
        <label for="customer">
          客戶
          <span class="required">*</span>
        </label>

        <input
          type="text"
          id="customer"
          placeholder="選擇既有件號時自動帶入"
          required
        >

        <div
          id="customerHint"
          class="field-hint"
        >
          選擇既有件號時由系統自動帶入；新件號請手動輸入。
        </div>
      </div>


      <div class="form-group">
        <label for="supplier">
          供料方
          <span class="required">*</span>
        </label>

        <input
          type="text"
          id="supplier"
          placeholder="客供料會自動等於客戶"
          required
        >

        <div
          id="supplierHint"
          class="field-hint"
        >
          客供料：系統自動帶入客戶；自購料：請輸入供應商 / 廠商。
        </div>
      </div>
      <div
        style="
          margin: 24px 0 14px;
          padding-top: 18px;
          border-top: 1px solid #e5e7eb;
          font-weight: 700;
          font-size: 16px;
        "
      >
        🧼 清洗／入料秤重
      </div>


      <div class="form-group">
        <label for="washDate">
          清洗日期（選填）
        </label>

        <input
          type="date"
          id="washDate"
        >
      </div>


      <div
        style="
          display:grid;
          grid-template-columns:1fr 1fr;
          gap:12px;
        "
      >
        <div class="form-group">
          <label for="boxCount">
            箱數
          </label>

          <input
            type="number"
            id="boxCount"
            min="0"
            step="1"
            inputmode="numeric"
            placeholder="例如：3"
          >
        </div>

        <div class="form-group">
          <label for="boxWeight">
            單箱重量 kg
          </label>

          <input
            type="number"
            id="boxWeight"
            min="0"
            step="0.001"
            inputmode="decimal"
            placeholder="例如：20"
          >
        </div>
      </div>


      <div class="form-group">
        <label for="tailWeight">
          尾數 kg
        </label>

        <input
          type="number"
          id="tailWeight"
          min="0"
          step="0.001"
          inputmode="decimal"
          placeholder="例如：4.350"
        >
      </div>


      <div class="form-group">
        <label for="calculatedWeight">
          入料總重量 kg
        </label>

        <input
          type="number"
          id="calculatedWeight"
          step="0.001"
          readonly
          placeholder="系統自動計算"
        >

        <div class="field-hint">
          箱數 × 單箱重量 + 尾數
        </div>
      </div>


      <div class="form-group">
        <label for="unitWeight">
          單顆重量 g（選填）
        </label>

        <input
          type="number"
          id="unitWeight"
          min="0"
          step="0.001"
          inputmode="decimal"
          placeholder="例如：2.153"
        >
      </div>


      <div class="form-group">
        <label for="forgingDate">
          鍛打製造日期（選填）
        </label>

        <input
          type="date"
          id="forgingDate"
        >
      </div>


      <div class="form-group">
        <label for="forgingMachine">
          鍛打製造機台（選填）
        </label>

        <input
          type="text"
          id="forgingMachine"
          placeholder="例如：鍛打機台編號"
          maxlength="100"
        >
      </div>


      <div class="form-group">
        <label for="returnDate">
          預計完成日（選填）
        </label>

        <input
          type="date"
          id="returnDate"
        >
      </div>


      <div class="form-group">
        <label for="remark">
          備註
        </label>

        <textarea
          id="remark"
          placeholder="沒有可留白"
        ></textarea>
      </div>


      <button
        id="submitBtn"
        class="submit-btn"
        type="submit"
      >
        建立生產批次
      </button>

    </form>


    <section class="today-section">

      <div class="today-header">
        <h2>今日已建立批次</h2>

        <button
          type="button"
          class="refresh-btn"
          onclick="loadTodayBatches()"
        >
          重新整理
        </button>
      </div>

      <div id="todayBatchList">
        <div class="empty-message">
          載入中...
        </div>
      </div>

    </section>

  </div>
</div>


<script>

// ============================================================
// 設定
// ============================================================

const LIFF_ID =
  '2011673429-ROxFgkBr';

const GAS_WEB_APP_URL =
  'https://script.google.com/macros/s/AKfycbyCdjMiE1RrNlAue5OzMGQCa9vhgd0cmwdjRE-G96377aA0IXFkCclh_GUoOe4qN8GFeg/exec';


// ============================================================
// 全域變數
// ============================================================

let currentUserId = '';
let currentEmployeeName = '';
let partMap = {};
let currentRequestId = null;
let isSubmitting = false;


// ============================================================
// 啟動
// ============================================================

document.addEventListener(
  'DOMContentLoaded',
  initializeApp
);


async function initializeApp() {
  try {
    setLoadingText(
      '正在初始化 LINE...'
    );

    setToday();

    await liff.init({
      liffId: LIFF_ID
    });

    if (!liff.isLoggedIn()) {
      liff.login({
        redirectUri:
          window.location.href
      });

      return;
    }

    setLoadingText(
      '正在取得 LINE 身分...'
    );

    const profile =
      await liff.getProfile();

    currentUserId =
      profile.userId;

    if (!currentUserId) {
      throw new Error(
        '無法取得 LINE User ID'
      );
    }

    setLoadingText(
      '正在確認系統權限...'
    );

    const auth =
      await apiGet(
        'checkAuth',
        {
          userId:
            currentUserId
        }
      );

    if (
      !auth.success ||
      !auth.authorized
    ) {
      showUnauthorized(
        '您沒有使用此系統的權限'
      );

      return;
    }

    if (!auth.canWrite) {
      showUnauthorized(
        '您的帳號只有讀取權限，無法建立生產批次'
      );

      return;
    }

    currentEmployeeName =
      auth.employeeName || '未知';

    document
      .getElementById(
        'employeeName'
      )
      .textContent =
        currentEmployeeName;

    setLoadingText(
      '正在載入件號資料...'
    );

    await loadParts();

    updateMaterialSourceUI();

    document
      .getElementById(
        'loadingScreen'
      )
      .style.display =
        'none';

    document
      .getElementById(
        'mainApp'
      )
      .style.display =
        'block';

    await loadTodayBatches();

  } catch (error) {
    console.error(error);

    showUnauthorized(
      error.message ||
      '系統初始化失敗'
    );
  }
}


// ============================================================
// Loading / Unauthorized
// ============================================================

function setLoadingText(text) {
  document
    .getElementById(
      'loadingText'
    )
    .textContent =
      text;
}


function showUnauthorized(message) {
  document
    .getElementById(
      'loadingScreen'
    )
    .style.display =
      'none';

  document
    .getElementById(
      'mainApp'
    )
    .style.display =
      'none';

  document
    .getElementById(
      'unauthorizedScreen'
    )
    .style.display =
      'flex';

  document
    .getElementById(
      'unauthorizedMessage'
    )
    .textContent =
      message;
}


// ============================================================
// 今天日期
// ============================================================

function setToday() {
  const now =
    new Date();

  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      '0'
    );

  const day =
    String(
      now.getDate()
    ).padStart(
      2,
      '0'
    );

  const today =
    `${year}-${month}-${day}`;

  document
    .getElementById(
      'arrivalDate'
    )
    .value =
      today;

  const washDate =
    document.getElementById(
      'washDate'
    );

  if (washDate) {
    washDate.value =
      today;
  }
}


// ============================================================
// 料件來源 UI
// ============================================================

document
  .querySelectorAll(
    'input[name="materialSource"]'
  )
  .forEach(function(radio) {
    radio.addEventListener(
      'change',
      updateMaterialSourceUI
    );
  });


function getMaterialSource() {
  const sourceElement =
    document.querySelector(
      'input[name="materialSource"]:checked'
    );

  return sourceElement
    ? sourceElement.value
    : '';
}


function updateMaterialSourceUI() {
  const materialSource =
    getMaterialSource();

  const lotLabel =
    document.getElementById(
      'materialLotLabel'
    );

  const lotInput =
    document.getElementById(
      'materialLotNo'
    );

  const lotHint =
    document.getElementById(
      'materialLotHint'
    );

  const supplier =
    document.getElementById(
      'supplier'
    );

  const supplierHint =
    document.getElementById(
      'supplierHint'
    );

  if (materialSource === '客供料') {
    lotLabel.textContent =
      '來料批次號（客戶 Lot）';

    lotInput.placeholder =
      '輸入客戶來料批次號';

    lotHint.textContent =
      '請依客戶來料標示輸入。';

    supplier.readOnly =
      true;

    supplier.placeholder =
      '系統自動等於客戶';

    supplierHint.textContent =
      '客供料的供料方會自動等於客戶。';

    syncSupplierWithCustomer();

  } else {
    lotLabel.textContent =
      '來料批次號（供應商 Lot）';

    lotInput.placeholder =
      '輸入供應商來料批次號';

    lotHint.textContent =
      '請依供應商來料標示輸入。';

    supplier.readOnly =
      false;

    supplier.placeholder =
      '輸入供應商 / 廠商';

    supplierHint.textContent =
      '自購料請輸入實際供料的供應商 / 廠商。';

    // 切換成自購料時，避免保留原本自動帶入的客戶名稱
    supplier.value = '';
  }
}


// ============================================================
// 件號
// ============================================================

async function loadParts() {
  const data =
    await apiGet(
      'getParts',
      {
        userId:
          currentUserId
      }
    );

  if (!data.success) {
    throw new Error(
      data.message ||
      '件號載入失敗'
    );
  }

  partMap = {};

  const list =
    document.getElementById(
      'partList'
    );

  list.innerHTML = '';

  (data.parts || [])
    .forEach(function(item) {
      partMap[
        item.partNo
      ] = item;

      const option =
        document.createElement(
          'option'
        );

      option.value =
        item.partNo;

      if (item.customer) {
        option.label =
          item.customer;
      }

      list.appendChild(
        option
      );
    });
}


// ============================================================
// 件號 → 客戶
//
// 清單內件號：自動帶入客戶並鎖定
// 新件號：允許手動輸入客戶
// ============================================================

document
  .getElementById(
    'partSearch'
  )
  .addEventListener(
    'input',
    updatePartAndCustomer
  );


function updatePartAndCustomer() {
  const partNo =
    document
      .getElementById(
        'partSearch'
      )
      .value
      .trim();

  const customer =
    document.getElementById(
      'customer'
    );

  const customerHint =
    document.getElementById(
      'customerHint'
    );

  if (
    partNo &&
    partMap[partNo]
  ) {
    customer.value =
      partMap[
        partNo
      ].customer || '';

    customer.readOnly =
      true;

    customerHint.textContent =
      '此件號來自既有清單，客戶已自動帶入。';

    customerHint.classList.remove(
      'manual-hint'
    );

  } else {
    customer.readOnly =
      false;

    customer.value = '';

    if (partNo) {
      customerHint.textContent =
        '此件號不在既有清單中，請手動輸入客戶。';

      customerHint.classList.add(
        'manual-hint'
      );

    } else {
      customerHint.textContent =
        '選擇既有件號時由系統自動帶入；新件號請手動輸入。';

      customerHint.classList.remove(
        'manual-hint'
      );
    }
  }

  syncSupplierWithCustomer();
}


// 客戶手動輸入時，客供料同步更新供料方
document
  .getElementById(
    'customer'
  )
  .addEventListener(
    'input',
    syncSupplierWithCustomer
  );


function syncSupplierWithCustomer() {
  if (
    getMaterialSource() !==
    '客供料'
  ) {
    return;
  }

  const customer =
    document
      .getElementById(
        'customer'
      )
      .value
      .trim();

  document
    .getElementById(
      'supplier'
    )
    .value =
      customer;
}



// ============================================================
// 入料總重量自動計算
// ============================================================

[
  'boxCount',
  'boxWeight',
  'tailWeight'
].forEach(function(id) {
  document
    .getElementById(id)
    .addEventListener(
      'input',
      updateCalculatedWeight
    );
});


function updateCalculatedWeight() {
  const boxCount =
    Number(
      document
        .getElementById(
          'boxCount'
        )
        .value || 0
    );

  const boxWeight =
    Number(
      document
        .getElementById(
          'boxWeight'
        )
        .value || 0
    );

  const tailWeight =
    Number(
      document
        .getElementById(
          'tailWeight'
        )
        .value || 0
    );

  const total =
    boxCount * boxWeight +
    tailWeight;

  document
    .getElementById(
      'calculatedWeight'
    )
    .value =
      total > 0
        ? total.toFixed(3)
        : '';
}


// ============================================================
// Form submit
// ============================================================

document
  .getElementById(
    'batchForm'
  )
  .addEventListener(
    'submit',
    submitBatch
  );


async function submitBatch(event) {
  event.preventDefault();

  if (isSubmitting) {
    return;
  }

  clearMessage();

  const materialSource =
    getMaterialSource();

  const materialLotNo =
    document
      .getElementById(
        'materialLotNo'
      )
      .value
      .trim();

  const arrivalDate =
    document
      .getElementById(
        'arrivalDate'
      )
      .value;

  const partNo =
    document
      .getElementById(
        'partSearch'
      )
      .value
      .trim();

  const customer =
    document
      .getElementById(
        'customer'
      )
      .value
      .trim();

  const supplier =
    document
      .getElementById(
        'supplier'
      )
      .value
      .trim();

  const washDate =
    document
      .getElementById(
        'washDate'
      )
      .value;

  const boxCount =
    Number(
      document
        .getElementById(
          'boxCount'
        )
        .value || 0
    );

  const boxWeight =
    Number(
      document
        .getElementById(
          'boxWeight'
        )
        .value || 0
    );

  const tailWeight =
    Number(
      document
        .getElementById(
          'tailWeight'
        )
        .value || 0
    );

  const unitWeight =
    Number(
      document
        .getElementById(
          'unitWeight'
        )
        .value || 0
    );

  const weight =
    boxCount * boxWeight +
    tailWeight;

  const forgingDate =
    document
      .getElementById(
        'forgingDate'
      )
      .value;

  const forgingMachine =
    document
      .getElementById(
        'forgingMachine'
      )
      .value
      .trim();

  const returnDate =
    document
      .getElementById(
        'returnDate'
      )
      .value;

  const remark =
    document
      .getElementById(
        'remark'
      )
      .value
      .trim();

  if (!materialSource) {
    showMessage(
      '請選擇料件來源',
      'error'
    );
    return;
  }

  if (!materialLotNo) {
    showMessage(
      materialSource === '客供料'
        ? '請輸入來料批次號（客戶 Lot）'
        : '請輸入來料批次號（供應商 Lot）',
      'error'
    );

    document
      .getElementById(
        'materialLotNo'
      )
      .focus();

    return;
  }

  if (!arrivalDate) {
    showMessage(
      '請選擇來料日期',
      'error'
    );
    return;
  }

  if (!partNo) {
    showMessage(
      '請輸入件號',
      'error'
    );
    return;
  }

  if (!customer) {
    showMessage(
      '請輸入客戶',
      'error'
    );

    document
      .getElementById(
        'customer'
      )
      .focus();

    return;
  }

  if (!supplier) {
    showMessage(
      materialSource === '客供料'
        ? '無法取得供料方，請確認客戶'
        : '自購料請輸入供料方 / 廠商',
      'error'
    );

    document
      .getElementById(
        materialSource === '客供料'
          ? 'customer'
          : 'supplier'
      )
      .focus();

    return;
  }

  if (
    !Number.isFinite(weight) ||
    weight <= 0
  ) {
    showMessage(
      '入料總重量必須大於 0，請輸入箱數/單箱重量或尾數',
      'error'
    );
    return;
  }

  if (
    returnDate &&
    returnDate < arrivalDate
  ) {
    showMessage(
      '預計完成日不可早於來料日期',
      'error'
    );
    return;
  }

  if (!currentRequestId) {
    currentRequestId =
      generateRequestId();
  }

  const payload = {
    action:
      'createBatch',

    userId:
      currentUserId,

    materialLotNo:
      materialLotNo,

    arrivalDate:
      arrivalDate,

    partNo:
      partNo,

    customer:
      customer,

    supplier:
      supplier,

    weight:
      weight,

    washDate:
      washDate,

    boxCount:
      boxCount,

    boxWeight:
      boxWeight,

    tailWeight:
      tailWeight,

    unitWeight:
      unitWeight,

    returnDate:
      returnDate,

    forgingDate:
      forgingDate,

    forgingMachine:
      forgingMachine,

    materialSource:
      materialSource,

    remark:
      remark,

    requestId:
      currentRequestId
  };

  const button =
    document.getElementById(
      'submitBtn'
    );

  try {
    isSubmitting = true;

    button.disabled = true;

    button.textContent =
      '建立中...';

    const result =
      await apiPost(
        payload
      );

    if (!result.success) {
      throw new Error(
        result.message ||
        '建立批次失敗'
      );
    }

    if (result.duplicate) {
      showMessage(
        `此筆資料已經建立過，批次 ID：${result.batchId}`,
        'success'
      );

    } else {
      showMessage(
        `建立成功！批次 ID：${result.batchId}`,
        'success'
      );
    }

    currentRequestId = null;

    resetEntryFields();

    await loadTodayBatches();

  } catch (error) {
    console.error(error);

    showMessage(
      error.message ||
      '送出失敗，請稍後再試',
      'error'
    );

  } finally {
    isSubmitting = false;

    button.disabled = false;

    button.textContent =
      '建立生產批次';
  }
}


// ============================================================

// ============================================================
// requestId
// ============================================================

function generateRequestId() {
  if (
    window.crypto &&
    typeof crypto.randomUUID ===
      'function'
  ) {
    return crypto.randomUUID();
  }

  return (
    Date.now()
      .toString(36)
    +
    '-'
    +
    Math.random()
      .toString(36)
      .substring(2, 12)
  );
}


// ============================================================
// 今日批次
// ============================================================

async function loadTodayBatches() {
  const container =
    document.getElementById(
      'todayBatchList'
    );

  container.innerHTML =
    '<div class="empty-message">載入中...</div>';

  try {
    const data =
      await apiGet(
        'getTodayBatches',
        {
          userId:
            currentUserId
        }
      );

    if (!data.success) {
      throw new Error(
        data.message ||
        '讀取今日批次失敗'
      );
    }

    renderTodayBatches(
      data.batches || []
    );

  } catch (error) {
    console.error(error);

    container.innerHTML =
      '<div class="empty-message">無法讀取今日批次</div>';
  }
}


// ============================================================
// 顯示今日批次
// ============================================================

function renderTodayBatches(
  batches
) {
  const container =
    document.getElementById(
      'todayBatchList'
    );

  if (!batches.length) {
    container.innerHTML =
      '<div class="empty-message">今天尚未建立批次</div>';
    return;
  }

  container.innerHTML =
    batches
      .map(function(batch) {
        const weightText =
          batch.arrivalWeight !== '' &&
          batch.arrivalWeight !== null
            ? `${escapeHtml(batch.arrivalWeight)} kg`
            : '-';

        return `
          <div class="batch-card">

            <div class="batch-card-top">
              <div class="batch-id">
                ${escapeHtml(batch.batchId)}
              </div>

              <div class="batch-status">
                ${escapeHtml(batch.status)}
              </div>
            </div>

            <div class="material-lot">
              來料批次號：
              ${escapeHtml(
                batch.materialLotNo || '-'
              )}
            </div>

            <div class="batch-part">
              ${escapeHtml(batch.partNo)}
            </div>

            <div class="batch-detail">
              客戶：
              ${escapeHtml(batch.customer)}
            </div>

            <div class="batch-detail">
              供料方：
              ${escapeHtml(batch.supplier)}
              ・
              ${weightText}
            </div>

            ${
              batch.washDate ||
              batch.boxCount ||
              batch.boxWeight ||
              batch.tailWeight ||
              batch.unitWeight
                ? `
                  <div class="batch-detail">
                    清洗：
                    ${escapeHtml(
                      batch.washDate || '-'
                    )}
                    ・
                    ${escapeHtml(
                      batch.boxCount || '0'
                    )} 箱 ×
                    ${escapeHtml(
                      batch.boxWeight || '0'
                    )} kg
                    ＋ 尾數
                    ${escapeHtml(
                      batch.tailWeight || '0'
                    )} kg
                  </div>

                  <div class="batch-detail">
                    單顆重量：
                    ${escapeHtml(
                      batch.unitWeight || '-'
                    )} g
                  </div>
                `
                : ''
            }

            <div class="batch-detail">
              預計完成：
              ${escapeHtml(
                batch.returnDate || '-'
              )}
            </div>

            ${
              batch.forgingDate ||
              batch.forgingMachine
                ? `
                  <div class="batch-detail">
                    鍛打：
                    ${escapeHtml(
                      batch.forgingDate || '-'
                    )}
                    ・
                    ${escapeHtml(
                      batch.forgingMachine || '-'
                    )}
                  </div>
                `
                : ''
            }

            <div class="batch-actions">
              <button
                type="button"
                class="regen-btn"
                onclick="regenerateReport(
                  '${escapeJsString(batch.batchId || '')}',
                  this
                )"
              >
                🖨️ 產生／重新產生加工回報單
              </button>
            </div>

            <div class="batch-detail">
              ${escapeHtml(
                batch.materialSource
              )}
              ・登錄：
              ${escapeHtml(
                batch.createdBy
              )}
            </div>

          </div>
        `;
      })
      .join('');
}



// ============================================================
// 產生／重新產生加工回報單
// ============================================================

async function regenerateReport(
  batchId,
  button
) {
  if (!batchId || !button) {
    return;
  }

  const originalText =
    button.textContent;

  try {
    button.disabled = true;
    button.textContent =
      '產生中...';

    const result =
      await apiGet(
        'regenerateReport',
        {
          userId:
            currentUserId,
          batchId:
            batchId
        }
      );

    if (!result.success) {
      throw new Error(
        result.message ||
        '重新產生失敗'
      );
    }

    if (!result.pdfUrl) {
      throw new Error(
        'PDF 已執行產生，但沒有取得檔案網址'
      );
    }

    showMessage(
      `批次 ${batchId} 的加工回報單已重新產生`,
      'success'
    );

    // 直接開啟新產生的 PDF
    window.open(
      result.pdfUrl,
      '_blank'
    );

  } catch (error) {
    console.error(error);

    showMessage(
      error.message ||
      '重新產生加工回報單失敗',
      'error'
    );

  } finally {
    button.disabled = false;
    button.textContent =
      originalText;
  }
}


// 避免批次 ID 放進 onclick 字串時破壞 JavaScript
function escapeJsString(value) {
  return String(
    value == null ? '' : value
  )
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/\r/g, '\\r')
    .replace(/\n/g, '\\n');
}


// ============================================================
// API GET
// ============================================================

async function apiGet(
  action,
  params = {}
) {
  const url =
    new URL(
      GAS_WEB_APP_URL
    );

  url.searchParams.set(
    'action',
    action
  );

  Object
    .entries(params)
    .forEach(
      function(
        [key, value]
      ) {
        url.searchParams.set(
          key,
          value
        );
      }
    );

  const response =
    await fetch(
      url.toString(),
      {
        method: 'GET',
        cache: 'no-store'
      }
    );

  if (!response.ok) {
    throw new Error(
      `HTTP ${response.status}`
    );
  }

  return await response.json();
}

// ============================================================
// API POST
// 不設定 Content-Type，避免不必要的 CORS preflight
// ============================================================

async function apiPost(data) {
  const response =
    await fetch(
      GAS_WEB_APP_URL,
      {
        method: 'POST',
        redirect: 'follow',
        body:
          JSON.stringify(data)
      }
    );

  if (!response.ok) {
    throw new Error(
      `HTTP ${response.status}`
    );
  }

  return await response.json();
}


// ============================================================
// Message
// ============================================================

function showMessage(
  text,
  type
) {
  const box =
    document.getElementById(
      'messageBox'
    );

  box.textContent =
    text;

  box.className =
    'message ' + type;

  box.scrollIntoView({
    behavior: 'smooth',
    block: 'nearest'
  });
}


function clearMessage() {
  const box =
    document.getElementById(
      'messageBox'
    );

  box.textContent = '';

  box.className =
    'message';
}


// ============================================================
// HTML escape
// ============================================================

function escapeHtml(value) {
  return String(
    value ?? ''
  )
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
