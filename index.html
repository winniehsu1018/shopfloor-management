<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>生產批次登錄</title>


  <!-- LINE LIFF SDK -->
  <script
    src="https://static.line-scdn.net/liff/edge/2/sdk.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Noto Sans TC",
        sans-serif;

      background: #f5f6f8;

      color: #222;
    }


    .container {

      max-width: 680px;

      margin: 0 auto;

      padding: 16px;
    }


    .card {

      background: #ffffff;

      border-radius: 16px;

      padding: 20px;

      box-shadow:
        0 2px 12px
        rgba(0, 0, 0, 0.06);
    }


    h1 {

      margin:
        0 0 6px 0;

      font-size: 24px;
    }


    .subtitle {

      color: #777;

      font-size: 14px;

      margin-bottom: 18px;
    }


    /* --------------------------------
       使用者
    -------------------------------- */

    .user-box {

      background: #f7f8fa;

      border-radius: 10px;

      padding: 12px;

      margin-bottom: 18px;

      font-size: 14px;
    }


    .user-name {

      font-weight: 700;

      margin-left: 5px;
    }


    /* --------------------------------
       表單
    -------------------------------- */

    .form-group {

      margin-bottom: 16px;
    }


    label {

      display: block;

      font-weight: 600;

      margin-bottom: 7px;

      font-size: 15px;
    }


    .required {

      color: #e53935;
    }


    input,
    textarea {

      width: 100%;

      padding: 12px;

      border:
        1px solid #d7dbe0;

      border-radius: 10px;

      font-size: 16px;

      background: #fff;
    }


    input:focus,
    textarea:focus {

      outline: none;

      border-color: #777;
    }


    input[readonly] {

      background: #f3f4f6;

      color: #555;
    }


    textarea {

      resize: vertical;

      min-height: 85px;
    }


    /* --------------------------------
       料件來源
    -------------------------------- */

    .radio-group {

      display: flex;

      gap: 10px;
    }


    .radio-option {

      flex: 1;

      border:
        1px solid #d7dbe0;

      border-radius: 10px;

      padding: 12px;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 7px;

      cursor: pointer;

      background: #fff;
    }


    .radio-option input {

      width: auto;

      margin: 0;
    }


    /* --------------------------------
       送出
    -------------------------------- */

    .submit-btn {

      width: 100%;

      border: none;

      border-radius: 12px;

      padding: 14px;

      font-size: 17px;

      font-weight: 700;

      background: #1f9d55;

      color: white;

      cursor: pointer;

      margin-top: 4px;
    }


    .submit-btn:disabled {

      background: #aab2b9;

      cursor: not-allowed;
    }


    /* --------------------------------
       訊息
    -------------------------------- */

    .message {

      display: none;

      border-radius: 10px;

      padding: 12px;

      margin-bottom: 16px;

      font-size: 14px;

      line-height: 1.6;
    }


    .message.success {

      display: block;

      background: #eaf8ef;

      color: #176b35;
    }


    .message.error {

      display: block;

      background: #fff0f0;

      color: #c62828;
    }


    /* --------------------------------
       今日批次
    -------------------------------- */

    .today-section {

      margin-top: 26px;

      padding-top: 20px;

      border-top:
        1px solid #e5e7eb;
    }


    .today-header {

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      margin-bottom: 12px;
    }


    .today-header h2 {

      margin: 0;

      font-size: 18px;
    }


    .refresh-btn {

      border: none;

      background: #f0f2f5;

      padding: 8px 12px;

      border-radius: 8px;

      font-size: 14px;

      cursor: pointer;
    }


    .batch-card {

      background: #fff;

      border:
        1px solid #e4e7eb;

      border-radius: 12px;

      padding: 14px;

      margin-bottom: 10px;
    }


    .batch-card-top {

      display: flex;

      justify-content:
        space-between;

      align-items: center;
    }


    .batch-id {

      font-size: 16px;

      font-weight: 700;
    }


    .batch-status {

      background: #f0f2f5;

      border-radius: 20px;

      padding: 4px 9px;

      font-size: 12px;
    }


    .batch-part {

      font-size: 16px;

      font-weight: 600;

      margin-top: 9px;
    }


    .batch-detail {

      font-size: 14px;

      color: #666;

      margin-top: 5px;

      line-height: 1.5;
    }


    .empty-message {

      text-align: center;

      color: #888;

      padding: 20px 10px;
    }


    /* --------------------------------
       Loading / Unauthorized
    -------------------------------- */

    .full-screen {

      position: fixed;

      inset: 0;

      background: #f5f6f8;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      z-index: 9999;
    }


    .status-card {

      width: 100%;

      max-width: 370px;

      background: white;

      border-radius: 18px;

      padding: 28px 22px;

      text-align: center;

      box-shadow:
        0 4px 18px
        rgba(0, 0, 0, 0.07);
    }


    .status-icon {

      font-size: 38px;

      margin-bottom: 10px;
    }


    .status-title {

      font-size: 20px;

      font-weight: 700;

      margin-bottom: 8px;
    }


    .status-text {

      color: #777;

      line-height: 1.6;
    }


    #mainApp {

      display: none;
    }

  </style>

</head>


<body>


<!-- ======================================================
     初始化畫面
====================================================== -->

<div
  id="loadingScreen"
  class="full-screen"
>

  <div class="status-card">

    <div class="status-icon">
      ⏳
    </div>

    <div class="status-title">
      系統載入中
    </div>

    <div
      id="loadingText"
      class="status-text"
    >
      正在確認您的 LINE 身分...
    </div>

  </div>

</div>


<!-- ======================================================
     無權限
====================================================== -->

<div
  id="unauthorizedScreen"
  class="full-screen"
  style="display:none;"
>

  <div class="status-card">

    <div class="status-icon">
      ⚠️
    </div>

    <div class="status-title">
      無法進入系統
    </div>

    <div
      id="unauthorizedMessage"
      class="status-text"
    >
      您沒有使用此系統的權限
    </div>

  </div>

</div>


<!-- ======================================================
     主畫面
====================================================== -->

<div
  id="mainApp"
  class="container"
>

  <div class="card">

    <h1>
      📦 生產批次登錄
    </h1>

    <div class="subtitle">
      客供料 / 自購料生產批次管理
    </div>


    <!-- 使用者 -->

    <div class="user-box">

      登錄人員：

      <span
        id="employeeName"
        class="user-name"
      >
        -
      </span>

    </div>


    <!-- 訊息 -->

    <div
      id="messageBox"
      class="message"
    ></div>


    <!-- ==================================================
         表單
    =================================================== -->

    <form
      id="batchForm"
      autocomplete="off"
    >


      <!-- 料件來源 -->

      <div class="form-group">

        <label>
          料件來源
          <span class="required">*</span>
        </label>


        <div class="radio-group">


          <label class="radio-option">

            <input
              type="radio"
              name="materialSource"
              value="客供料"
              checked
            >

            客供料

          </label>


          <label class="radio-option">

            <input
              type="radio"
              name="materialSource"
              value="自購料"
            >

            自購料

          </label>


        </div>

      </div>


      <!-- 來料日期 -->

      <div class="form-group">

        <label for="arrivalDate">

          來料日期
          <span class="required">*</span>

        </label>


        <input
          type="date"
          id="arrivalDate"
          required
        >

      </div>


      <!-- 件號 -->

      <div class="form-group">

        <label for="partSearch">

          件號
          <span class="required">*</span>

        </label>


        <input
          type="text"
          id="partSearch"
          list="partList"
          placeholder="輸入或選擇件號"
          required
        >


        <datalist
          id="partList"
        ></datalist>

      </div>


      <!-- 客戶 -->

      <div class="form-group">

        <label for="customer">
          客戶
        </label>


        <input
          type="text"
          id="customer"
          readonly
        >

      </div>


      <!-- 重量 -->

      <div class="form-group">

        <label for="weight">

          來料重量 kg
          <span class="required">*</span>

        </label>


        <input
          type="number"
          id="weight"
          step="0.001"
          min="0.001"
          inputmode="decimal"
          placeholder="例如：60"
          required
        >

      </div>


      <!-- 預計交回 -->

      <div class="form-group">

        <label for="returnDate">

          預計交回日
          <span class="required">*</span>

        </label>


        <input
          type="date"
          id="returnDate"
          required
        >

      </div>


      <!-- 備註 -->

      <div class="form-group">

        <label for="remark">
          備註
        </label>


        <textarea
          id="remark"
          placeholder="沒有可留白"
        ></textarea>

      </div>


      <!-- Submit -->

      <button
        id="submitBtn"
        class="submit-btn"
        type="submit"
      >
        建立生產批次
      </button>


    </form>


    <!-- ==================================================
         今日批次
    =================================================== -->

    <section class="today-section">


      <div class="today-header">

        <h2>
          今日已建立批次
        </h2>


        <button
          type="button"
          class="refresh-btn"
          onclick="loadTodayBatches()"
        >
          重新整理
        </button>

      </div>


      <div id="todayBatchList">

        <div class="empty-message">
          載入中...
        </div>

      </div>


    </section>


  </div>

</div>


<script>

// ============================================================
// 設定
// ============================================================

const LIFF_ID =
  '2011673429-ROxFgkBr';


// ★★★ 請把這裡改成你的 GAS /exec 網址 ★★★

const GAS_WEB_APP_URL =
  'https://script.google.com/macros/s/AKfycbyCdjMiE1RrNlAue5OzMGQCa9vhgd0cmwdjRE-G96377aA0IXFkCclh_GUoOe4qN8GFeg/exec';



// ============================================================
// 全域變數
// ============================================================

let currentUserId = '';

let currentEmployeeName = '';

let partMap = {};

let currentRequestId = null;

let isSubmitting = false;



// ============================================================
// 啟動
// ============================================================

document.addEventListener(
  'DOMContentLoaded',
  initializeApp
);



async function initializeApp() {

  try {

    setLoadingText(
      '正在初始化 LINE...'
    );


    setToday();


    // --------------------------------------------------------
    // LIFF
    // --------------------------------------------------------

    await liff.init({
      liffId: LIFF_ID
    });


    // --------------------------------------------------------
    // 未登入
    // --------------------------------------------------------

    if (!liff.isLoggedIn()) {

      liff.login({
        redirectUri:
          window.location.href
      });

      return;
    }


    // --------------------------------------------------------
    // LINE Profile
    // --------------------------------------------------------

    setLoadingText(
      '正在取得 LINE 身分...'
    );


    const profile =
      await liff.getProfile();


    currentUserId =
      profile.userId;


    if (!currentUserId) {

      throw new Error(
        '無法取得 LINE User ID'
      );
    }


    // --------------------------------------------------------
    // 權限
    // --------------------------------------------------------

    setLoadingText(
      '正在確認系統權限...'
    );


    const auth =
      await apiGet(
        'checkAuth',
        {
          userId:
            currentUserId
        }
      );


    if (
      !auth.success ||
      !auth.authorized
    ) {

      showUnauthorized(
        '您沒有使用此系統的權限'
      );

      return;
    }


    if (!auth.canWrite) {

      showUnauthorized(
        '您的帳號只有讀取權限，無法建立生產批次'
      );

      return;
    }


    currentEmployeeName =
      auth.employeeName || '未知';


    document
      .getElementById(
        'employeeName'
      )
      .textContent =
        currentEmployeeName;


    // --------------------------------------------------------
    // 件號
    // --------------------------------------------------------

    setLoadingText(
      '正在載入件號資料...'
    );


    await loadParts();


    // --------------------------------------------------------
    // 顯示主畫面
    // --------------------------------------------------------

    document
      .getElementById(
        'loadingScreen'
      )
      .style.display =
        'none';


    document
      .getElementById(
        'mainApp'
      )
      .style.display =
        'block';


    // --------------------------------------------------------
    // 今日批次
    // --------------------------------------------------------

    await loadTodayBatches();


  } catch (error) {

    console.error(error);


    showUnauthorized(
      error.message ||
      '系統初始化失敗'
    );
  }
}



// ============================================================
// Loading
// ============================================================

function setLoadingText(text) {

  document
    .getElementById(
      'loadingText'
    )
    .textContent =
      text;
}



// ============================================================
// 無權限 / 錯誤
// ============================================================

function showUnauthorized(message) {

  document
    .getElementById(
      'loadingScreen'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'mainApp'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'unauthorizedScreen'
    )
    .style.display =
      'flex';


  document
    .getElementById(
      'unauthorizedMessage'
    )
    .textContent =
      message;
}



// ============================================================
// 今天日期
// ============================================================

function setToday() {

  const now =
    new Date();


  const year =
    now.getFullYear();


  const month =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      '0'
    );


  const day =
    String(
      now.getDate()
    ).padStart(
      2,
      '0'
    );


  document
    .getElementById(
      'arrivalDate'
    )
    .value =
      `${year}-${month}-${day}`;
}



// ============================================================
// 件號
// ============================================================

async function loadParts() {

  const data =
    await apiGet(
      'getParts',
      {
        userId:
          currentUserId
      }
    );


  if (!data.success) {

    throw new Error(
      data.message ||
      '件號載入失敗'
    );
  }


  partMap = {};


  const list =
    document.getElementById(
      'partList'
    );


  list.innerHTML = '';


  (data.parts || [])
    .forEach(function(item) {


      partMap[
        item.partNo
      ] = item;


      const option =
        document.createElement(
          'option'
        );


      option.value =
        item.partNo;


      if (item.customer) {

        option.label =
          item.customer;
      }


      list.appendChild(
        option
      );

    });
}



// ============================================================
// 件號 → 客戶
// ============================================================

document
  .getElementById(
    'partSearch'
  )
  .addEventListener(
    'input',
    function() {

      const partNo =
        this.value.trim();


      const customer =
        document.getElementById(
          'customer'
        );


      if (
        partMap[partNo]
      ) {

        customer.value =
          partMap[
            partNo
          ].customer || '';

      } else {

        customer.value = '';
      }

    }
  );



// ============================================================
// Form submit
// ============================================================

document
  .getElementById(
    'batchForm'
  )
  .addEventListener(
    'submit',
    submitBatch
  );



async function submitBatch(event) {

  event.preventDefault();


  // 防止使用者連點
  if (isSubmitting) {

    return;
  }


  clearMessage();


  const arrivalDate =
    document
      .getElementById(
        'arrivalDate'
      )
      .value;


  const partNo =
    document
      .getElementById(
        'partSearch'
      )
      .value
      .trim();


  const weight =
    Number(
      document
        .getElementById(
          'weight'
        )
        .value
    );


  const returnDate =
    document
      .getElementById(
        'returnDate'
      )
      .value;


  const remark =
    document
      .getElementById(
        'remark'
      )
      .value
      .trim();


  const sourceElement =
    document.querySelector(
      'input[name="materialSource"]:checked'
    );


  const materialSource =
    sourceElement
      ? sourceElement.value
      : '';


  // --------------------------------------------------------
  // 驗證
  // --------------------------------------------------------

  if (!arrivalDate) {

    showMessage(
      '請選擇來料日期',
      'error'
    );

    return;
  }


  if (
    !partNo ||
    !partMap[partNo]
  ) {

    showMessage(
      '請從件號清單中選擇正確的件號',
      'error'
    );

    return;
  }


  if (
    !Number.isFinite(weight) ||
    weight <= 0
  ) {

    showMessage(
      '請輸入正確的來料重量',
      'error'
    );

    return;
  }


  if (!returnDate) {

    showMessage(
      '請選擇預計交回日',
      'error'
    );

    return;
  }


  if (
    returnDate <
    arrivalDate
  ) {

    showMessage(
      '預計交回日不可早於來料日期',
      'error'
    );

    return;
  }


  if (!materialSource) {

    showMessage(
      '請選擇料件來源',
      'error'
    );

    return;
  }


  // --------------------------------------------------------
  // requestId
  //
  // 只有第一次送出時建立。
  // 如果網路失敗，保留同一個 requestId。
  // --------------------------------------------------------

  if (!currentRequestId) {

    currentRequestId =
      generateRequestId();
  }


  const payload = {

    action:
      'createBatch',

    userId:
      currentUserId,

    arrivalDate:
      arrivalDate,

    partNo:
      partNo,

    weight:
      weight,

    returnDate:
      returnDate,

    materialSource:
      materialSource,

    remark:
      remark,

    requestId:
      currentRequestId

  };


  const button =
    document.getElementById(
      'submitBtn'
    );


  try {

    isSubmitting = true;

    button.disabled = true;

    button.textContent =
      '建立中...';


    const result =
      await apiPost(
        payload
      );


    if (!result.success) {

      throw new Error(
        result.message ||
        '建立批次失敗'
      );
    }


    // --------------------------------------------------------
    // 成功
    // --------------------------------------------------------

    if (result.duplicate) {

      showMessage(
        `此筆資料已經建立過，批次 ID：${result.batchId}`,
        'success'
      );

    } else {

      showMessage(
        `建立成功！批次 ID：${result.batchId}`,
        'success'
      );
    }


    // --------------------------------------------------------
    // 成功後才清除 requestId
    // --------------------------------------------------------

    currentRequestId = null;


    // --------------------------------------------------------
    // 清空下一筆輸入
    // --------------------------------------------------------

    document
      .getElementById(
        'partSearch'
      )
      .value = '';


    document
      .getElementById(
        'customer'
      )
      .value = '';


    document
      .getElementById(
        'weight'
      )
      .value = '';


    document
      .getElementById(
        'returnDate'
      )
      .value = '';


    document
      .getElementById(
        'remark'
      )
      .value = '';


    // --------------------------------------------------------
    // 更新今日批次
    // --------------------------------------------------------

    await loadTodayBatches();


  } catch (error) {

    console.error(error);


    // 注意：
    // 這裡故意不清除 currentRequestId
    //
    // 如果 GAS 已經寫入但手機沒收到回應，
    // 再送一次仍會使用相同 requestId，
    // GAS 就能判斷為重複。

    showMessage(
      error.message ||
      '送出失敗，請稍後再試',
      'error'
    );


  } finally {

    isSubmitting = false;

    button.disabled = false;

    button.textContent =
      '建立生產批次';
  }
}



// ============================================================
// requestId
// ============================================================

function generateRequestId() {

  if (
    window.crypto &&
    typeof crypto.randomUUID ===
      'function'
  ) {

    return crypto.randomUUID();
  }


  return (
    Date.now()
      .toString(36)
    +
    '-'
    +
    Math.random()
      .toString(36)
      .substring(2, 12)
  );
}



// ============================================================
// 今日批次
// ============================================================

async function loadTodayBatches() {

  const container =
    document.getElementById(
      'todayBatchList'
    );


  container.innerHTML =
    '<div class="empty-message">載入中...</div>';


  try {

    const data =
      await apiGet(
        'getTodayBatches',
        {
          userId:
            currentUserId
        }
      );


    if (!data.success) {

      throw new Error(
        data.message ||
        '讀取今日批次失敗'
      );
    }


    renderTodayBatches(
      data.batches || []
    );


  } catch (error) {

    console.error(error);


    container.innerHTML =
      '<div class="empty-message">無法讀取今日批次</div>';
  }
}



// ============================================================
// 顯示今日批次
// ============================================================

function renderTodayBatches(
  batches
) {

  const container =
    document.getElementById(
      'todayBatchList'
    );


  if (!batches.length) {

    container.innerHTML =
      '<div class="empty-message">今天尚未建立批次</div>';

    return;
  }


  container.innerHTML =
    batches
      .map(function(batch) {

        const weightText =
          batch.arrivalWeight !== '' &&
          batch.arrivalWeight !== null
            ? `${escapeHtml(batch.arrivalWeight)} kg`
            : '-';


        return `

          <div class="batch-card">

            <div class="batch-card-top">

              <div class="batch-id">
                ${escapeHtml(batch.batchId)}
              </div>

              <div class="batch-status">
                ${escapeHtml(batch.status)}
              </div>

            </div>


            <div class="batch-part">
              ${escapeHtml(batch.partNo)}
            </div>


            <div class="batch-detail">

              ${escapeHtml(batch.customer)}

              ・

              ${weightText}

            </div>


            <div class="batch-detail">

              預計交回：

              ${escapeHtml(
                batch.returnDate || '-'
              )}

            </div>


            <div class="batch-detail">

              ${escapeHtml(
                batch.materialSource
              )}

              ・登錄：

              ${escapeHtml(
                batch.createdBy
              )}

            </div>

          </div>

        `;

      })
      .join('');
}



// ============================================================
// API GET
// ============================================================

async function apiGet(
  action,
  params = {}
) {

  const url =
    new URL(
      GAS_WEB_APP_URL
    );


  url.searchParams.set(
    'action',
    action
  );


  Object
    .entries(params)
    .forEach(
      function(
        [key, value]
      ) {

        url.searchParams.set(
          key,
          value
        );

      }
    );


  const response =
    await fetch(
      url.toString(),
      {
        method: 'GET',
        cache: 'no-store'
      }
    );


  if (!response.ok) {

    throw new Error(
      `HTTP ${response.status}`
    );
  }


  return await response.json();
}



// ============================================================
// API POST
//
// 不設定 Content-Type: application/json
// 避免瀏覽器先發送不必要的 CORS preflight。
// GAS 仍可透過 e.postData.contents 解析 JSON。
// ============================================================

async function apiPost(data) {

  const response =
    await fetch(
      GAS_WEB_APP_URL,
      {

        method: 'POST',

        redirect: 'follow',

        body:
          JSON.stringify(data)

      }
    );


  if (!response.ok) {

    throw new Error(
      `HTTP ${response.status}`
    );
  }


  return await response.json();
}



// ============================================================
// Message
// ============================================================

function showMessage(
  text,
  type
) {

  const box =
    document.getElementById(
      'messageBox'
    );


  box.textContent =
    text;


  box.className =
    'message ' + type;


  box.scrollIntoView({
    behavior: 'smooth',
    block: 'nearest'
  });
}



function clearMessage() {

  const box =
    document.getElementById(
      'messageBox'
    );


  box.textContent = '';

  box.className =
    'message';
}



// ============================================================
// HTML escape
// ============================================================

function escapeHtml(value) {

  return String(
    value ?? ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );
}
